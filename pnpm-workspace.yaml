# The eight packages this fork owns. The harness itself is the published
# @deepseek-ai/dsh pin the root manifest declares, not a workspace copy.
packages:
  - packages/workflow/workflow-spine
  - packages/bundle/graph
  - packages/bundle/refactory
  - packages/bundle/refactory-web
  - packages/refactory/refactory-console
  - packages/refactory/tool-refactory
  - packages/client/ui-refactory
  - packages/client/ui-brand-refactory

# A workspace package keeps its name against the registry copy of the same name.
linkWorkspacePackages: true

# Every cordis/schemastery name the pinned harness resolves through, at the exact
# version its own installed tree carries. The pin declares `~4.0.4`-style ranges
# for these, so the override is what holds one physical copy per name across the
# tree instead of letting each dependent float to its own patch release (#263).
overrides:
  '@deepseek-ai/cordis': '4.0.4'
  '@deepseek-ai/cordis-plugin-loader': '1.0.5'
  '@deepseek-ai/cordis-plugin-include': '1.0.9'
  '@deepseek-ai/cordis-plugin-timer': '1.1.6'
  '@deepseek-ai/cordis-plugin-group': '1.0.4'
  '@deepseek-ai/schemastery': '3.18.4'
  # flock without a diagnostic report; see vendor/node-addon-system/README.md.
  '@deepseek-ai/node-addon-system': 'file:./vendor/node-addon-system'
  # claude_code workers run the Claude Code this SDK bundles, not the person's own.
  # dsh-subagent-claude-code pins 0.3.263 (Claude Code 2.1.263), which the API refuses
  # claude-opus-5-5 to: it needs 2.1.280 or newer.
  '@anthropic-ai/claude-agent-sdk': '0.3.281'

peerDependencyRules:
  allowedVersions:
    typescript: '>=5 <7'

# pnpm 10+ blocks any dependency shipping an install/build script until it is
# explicitly reviewed here (strictDepBuilds defaults to true: an unlisted script
# is a hard install error). Deny by default; allow only what the pin needs to run.
allowBuilds:
  esbuild: true
  lefthook: true
  # Persistent terminal sessions: node-pty builds its native binding at install.
  node-pty: true
  # The Python runtime deploy's reviewed postinstall restores the executable bit
  # on node-pty's macOS spawn helper.
  '@deepseek-ai/dsh-subprocess-local': true
  # JSONL durability calls MoveFileExW with write-through publication on Windows.
  koffi: true
  # No-ops we do not need; listed so the review is explicit rather than absent.
  '@google/genai': false
  protobufjs: false
  msgpackr-extract: false
  # The vendored copy (see overrides): pnpm counts a local directory as a build; it has none.
  '@deepseek-ai/node-addon-system': false
patchedDependencies:
  '@deepseek-ai/dsh-client-ui-directory-picker-native@0.2.0-rc.2': patches/@deepseek-ai__dsh-client-ui-directory-picker-native@0.2.0-rc.2.patch
  '@deepseek-ai/dsh-headless@0.2.0-rc.2': patches/@deepseek-ai__dsh-headless@0.2.0-rc.2.patch
  '@deepseek-ai/dsh-goal-round-driver@0.2.0-rc.2': patches/@deepseek-ai__dsh-goal-round-driver@0.2.0-rc.2.patch
  '@deepseek-ai/dsh-subagent-codex@0.2.0-rc.2': patches/@deepseek-ai__dsh-subagent-codex@0.2.0-rc.2.patch
  '@deepseek-ai/dsh-subagent-claude-code@0.2.0-rc.2': patches/@deepseek-ai__dsh-subagent-claude-code@0.2.0-rc.2.patch
