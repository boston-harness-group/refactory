# Git hooks (lefthook). Keep these local checkpoints fast; CI owns the full
# repository-wide gate matrix.
# Install: `node_modules/.bin/lefthook install`.

pre-commit:
  jobs:
    - name: lint (staged)
      glob: '*.{ts,tsx,mts,cts,mjs}'
      run: node_modules/.bin/oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: whitespace (staged)
      run: git diff --cached --check

pre-merge-commit:
  jobs:
    - name: whitespace (staged)
      run: git diff --cached --check

pre-push:
  jobs:
    - name: typecheck
      run: pnpm run typecheck

    # Stale generated docs were the most common red CI run; this is seconds here.
    - name: docs:check
      run: pnpm run docs:check

    # An unclassified module or a stale command list otherwise fails CI after its
    # whole suite; these take seconds.
    - name: boundary, registry, command reference
      run: >-
        .venv/bin/python -m pytest -q -x -p no:cacheprovider
        refactory/tests/test_boundary.py refactory/tests/test_registry.py
        refactory/tests/test_cli.py::test_the_command_reference_matches_the_command_line
