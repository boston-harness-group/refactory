# Restrict root collection to SDK tests; recursive collection can include
# ignored worktrees or venvs and collide on same-named modules.
[pytest]
testpaths = python/sdk/tests
norecursedirs = node_modules .git dist-exe
# Four workers: the suite is I/O- and subprocess-heavy and parallelises cleanly
# (22.4 min serial to 5.7 min), while a fixed count keeps this honest under the
# container quotas the lab runs behind, where os.cpus() reports the host. Raise it
# with -n on a machine that really has the cores.
addopts = -n 4
