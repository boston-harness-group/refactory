# What is too long for every push but should still run without anyone remembering:
# the structure-edit harness's long tier (thousands of edits per seed, the spine on
# every twelfth accepted state, the regression corpus on the spine and the spine's
# mutation check; `refactory/docs/outer-loop.md`). Push CI (`ci.yml`) still runs every
# test it ran before, including the harness's short tier and every mutation check;
# this adds coverage and moves nothing.
name: Nightly

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure-fuzz-long:
    name: Structure-edit harness, long tier
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Install (fresh-checkout path)
        run: ./install.sh
      - name: Long tier
        env:
          STRUCTURE_FUZZ_REPORT: structure-fuzz.json
        # One process: it is one file, and conftest keeps a file on one worker anyway.
        run: >-
          uv run python -m pytest refactory/tests/test_structure_fuzz.py
          --run-structure-fuzz-long -m structure_fuzz_long -q -rfEs --timeout=5400
      - name: Keep the harness's counts and findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structure-fuzz-long
          path: structure-fuzz.json
          if-no-files-found: ignore

  # Fresh shard durations from the last five green CI runs on main, as an artifact. It
  # never commits: a person downloads `ci_durations.json` (or runs the same command)
  # and opens a pull request with it when the shards have drifted apart.
  ci-durations:
    name: Shard durations (artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Install (fresh-checkout path)
        run: ./install.sh
      # The shards' environment, so the cases that need the code-node sandbox are
      # collected and keep their seconds.
      - name: Allow the code-node sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          fi
      - name: Rebuild the durations
        env:
          GH_TOKEN: ${{ github.token }}
          REFACTORY_REQUIRE_MIGRATION_TESTS: "1"
          REFACTORY_REQUIRE_CODE_SANDBOX: "1"
        run: |
          uv run python scripts/ci-durations.py --latest 5
          git diff --stat -- refactory/tests/ci_durations.json
      - name: Keep them
        uses: actions/upload-artifact@v4
        with:
          name: ci-durations
          path: refactory/tests/ci_durations.json

  # A failed night opens (or comments on) one tracking issue per job that failed (the long
  # tier's, else the durations'), so the team sees it rather
  # than only whoever last edited the schedule. Its own job, holding the only token that
  # may write issues, so the test job and the code it runs never see one.
  report-failure:
    name: Report a failed night
    needs: [structure-fuzz-long, ci-durations]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          LONG_TIER: ${{ needs.structure-fuzz-long.result }}
          DURATIONS: ${{ needs.ci-durations.result }}
        run: |
          title="Nightly: the structure-edit harness's long tier failed"
          if [ "$LONG_TIER" = success ]; then
            title="Nightly: the shard durations job failed"
          fi
          body="The nightly failed on ${SHA:0:12} (long tier: $LONG_TIER, shard durations: $DURATIONS): $RUN_URL"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
