# The gate this repository was missing. Issue #270 exists because nothing ever
# ran the fresh-checkout sequence: `install.sh` built before it created `.venv`
# (invisible on every machine that already had one), and 32 stale tests could sit
# red on `main` because no job observed them.
#
# This job runs `install.sh` itself rather than restating its steps, so the
# ordering bug that motivated it cannot come back unnoticed. A runner is exactly
# the fresh machine the installer claims to support: no `.venv`, no
# `node_modules`, no DSH profile.
#
# Scope: the TypeScript suite (`pnpm test`), the whole-profile acceptance run and
# the Python suite under `refactory/tests/` all run here. The IR parity tests
# (`test_ir_parity.py`) compare refactory's IR against the reference graph language
# in the v1 subtree at `v1/`; the code is part of this repo so
# these tests run on every pull request. The Python suite was red for pre-existing reasons (issue #272)
# and is now gated: a failing test fails the job. A test that needs an external tool
# or a model credential is marked (`toolchain` plus a `needs_*` skip) and the
# terminal summary names every one that did not run, so a green suite cannot hide a
# path it never exercised. The stricter `--toolchain-gate` (every marked test must
# have run against its real tool) is a separate local check: this runner has no Lean,
# mathlib or model credential, so running it here would fail on the very absences
# the summary already reports.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref: a newer push cancels an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install-and-test:
    name: install.sh + TypeScript + Python suites
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # `refactory/tests/test_work_complete.py` reads the commit each tracked
          # item records and asks git to resolve it. A depth-1 clone holds one
          # commit, so every recorded hash would be unresolvable and the gate would
          # fail for a reason that is about the checkout rather than the work.
          fetch-depth: 0

      # `pnpm/setup` is the action for pnpm 11+ (this repo pins pnpm@11.7.0). It
      # installs the pinned pnpm — read from package.json's `packageManager`, so it
      # cannot drift — and the Node runtime in one step, replacing setup-node.
      # `install: false` leaves the dependency install to `install.sh`, the path
      # under test.
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false

      # uv owns `.venv` and reads `uv.lock`; the ordering fix depends on it
      # existing before the Node build runs `docs:check`. Pinned by commit: this
      # action publishes version tags, not a moving major one.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # The path a new checkout takes. On a fresh runner this is the real test of
      # the ordering, and it also creates the DSH profile the bundle needs.
      - name: Install (fresh-checkout path)
        run: ./install.sh


      # The TypeScript suite (`pnpm test`). Its 32 stale expectations are why
      # this job exists; a red suite here is the gate working.
      - name: TypeScript suite
        run: pnpm test

      # The whole-profile acceptance run: it runs `dsh_profile`'s provisioning
      # plan into a throwaway DSH_HOME, composes the owned `refactory` profile
      # from the harness's own `web` template, checks that template is left exactly
      # as it was, boots `refactory` and asks its live services. It belongs in
      # CI because it is the only thing that proves the `ceo` preset reaches the
      # roster through an inline agent-preset declaration instead of a patched
      # agent-presets tree,
      # and that the refactory-web layer mounts the console and picker with a
      # checkout-resolved `repoRoot` — a unit test cannot see the layer order that
      # decides whether a patch finds its row at all. It also has the CEO spawn
      # subagents on this profile and on the graph layer, and checks each child gets
      # its delegation row's allow-list and no shell, and that the graph CEO gets
      # none of its `ceoDeny`: which tools an agent inherits is only known once the
      # composition is booted.
      - name: Web profile acceptance
        run: pnpm run test:acceptance

      # The Python suite (issue #272). It runs the tests the install just built and
      # fails the job on any failure. Tests that need an external tool or a model
      # credential are marked and skipped with a reason; the toolchain summary at
      # the end of this step names every skipped unit, so a green run here states
      # what it did not verify rather than implying it verified everything.
      #
      # Four workers on this runner's four vCPUs: the suite is I/O- and
      # subprocess-heavy and parallelises cleanly (22.4 min serial to 5.7 min at
      # four on the lab). It is deliberately here and not in pytest.ini, because
      # some invocations must stay serial: --toolchain-gate reads per-test reports
      # in the controller, and the per-site base check runs one test under a cap.
      - name: Python suite
        env:
          REFACTORY_REQUIRE_MIGRATION_TESTS: "1"
        run: uv run python -m pytest refactory/tests -q -rs -n 4

      # The harness this repository pins and the `dsh` that boots the profile
      # must agree on the version and on the strict TypertCodec contract. CI has
      # no separate dsh on PATH, so this run proves the plain-clone case stays
      # green; the mismatch it reports is the one a development machine has when
      # PATH resolves to a different harness tree. `uv run` is the same venv the
      # install created.
      - name: Harness pin vs serving dsh
        run: uv run python -m refactory_dsh.harness_check
