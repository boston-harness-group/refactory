# The gate this repository was missing. Issue #270 exists because nothing ever
# ran the fresh-checkout sequence: `install.sh` built before it created `.venv`
# (invisible on every machine that already had one), and 32 stale tests could sit
# red on `main` because no job observed them.
#
# This job runs `install.sh` itself rather than restating its steps, so the
# ordering bug that motivated it cannot come back unnoticed. A runner is exactly
# the fresh machine the installer claims to support: no `.venv`, no
# `node_modules`, no DSH profile.
#
# Scope: the TypeScript suite (`pnpm test`), the whole-profile acceptance run and
# the Python suite under `refactory/tests/` (in four shards) all run here, with a
# fast-checks job beside them. The IR parity tests
# (`test_ir_parity.py`) compare refactory's IR against the reference graph language
# in the v1 subtree at `v1/`; the code is part of this repo so
# these tests run on every pull request. The Python suite was red for pre-existing reasons (issue #272)
# and is now gated: a failing test fails the job. A test that needs an external tool
# or a model credential is marked (`toolchain` plus a `needs_*` skip) and the
# terminal summary names every one that did not run, so a green suite cannot hide a
# path it never exercised. The stricter `--toolchain-gate` (every marked test must
# have run against its real tool) is a separate local check: this runner has no Lean,
# mathlib or model credential, so running it here would fail on the very absences
# the summary already reports.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref: a newer push cancels an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Seconds, not the half hour the suites take: the checks that catch most red runs
  # before they cost a suite. `install.sh` runs `docs:check` and `typecheck` (through
  # `pnpm run build`); ruff looks for syntax errors and undefined names; the boundary,
  # registry and command-reference tests catch an unclassified module or a stale
  # command list. It runs beside the suites rather than in front of them, so it adds
  # nothing to the wall time.
  fast-checks:
    name: Fast checks (docs, typecheck, ruff, boundary)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Install (docs:check and typecheck run here)
        run: ./install.sh
      - name: Ruff (syntax errors and undefined names)
        run: uvx ruff@0.15.0 check --isolated --select E9,F63,F7,F82 refactory scripts
      - name: Boundary, registry and command reference
        run: >-
          uv run python -m pytest -q -rfEs -x --timeout=300
          refactory/tests/test_boundary.py refactory/tests/test_registry.py
          "refactory/tests/test_cli.py::test_the_command_reference_matches_the_command_line"

  # The TypeScript side and the harness pin, once, beside the Python shards.
  typescript:
    name: install.sh + TypeScript suite + web acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `pnpm/setup` is the action for pnpm 11+ (this repo pins pnpm@11.7.0). It
      # installs the pinned pnpm — read from package.json's `packageManager`, so it
      # cannot drift — and the Node runtime in one step, replacing setup-node.
      # `install: false` leaves the dependency install to `install.sh`, the path
      # under test.
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false

      # uv owns `.venv` and reads `uv.lock`; the ordering fix depends on it
      # existing before the Node build runs `docs:check`. Pinned by commit: this
      # action publishes version tags, not a moving major one.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Pinned: runners moved to 3.14, whose argparse help text differs and
          # makes the generated docs/tutorial.html stale. 3.12 is what main was green on.
          python-version: "3.12"

      # The path a new checkout takes. On a fresh runner this is the real test of
      # the ordering, and it also creates the DSH profile the bundle needs.
      - name: Install (fresh-checkout path)
        run: ./install.sh

      # The TypeScript suite (`pnpm test`). Its 32 stale expectations are why
      # this job exists; a red suite here is the gate working.
      - name: TypeScript suite
        run: pnpm test

      # The whole-profile acceptance run: it runs `dsh_profile`'s provisioning
      # plan into a throwaway DSH_HOME, composes the owned `refactory` profile
      # from the harness's own `web` template, checks that template is left exactly
      # as it was, boots `refactory` and asks its live services. It belongs in
      # CI because it is the only thing that proves the `ceo` preset reaches the
      # roster through an inline agent-preset declaration instead of a patched
      # agent-presets tree,
      # and that the refactory-web layer mounts the console and picker with a
      # checkout-resolved `repoRoot` — a unit test cannot see the layer order that
      # decides whether a patch finds its row at all. It also has the CEO spawn
      # subagents on this profile and on the graph layer, and checks each child gets
      # its delegation row's allow-list and no shell, and that the graph CEO gets
      # none of its `ceoDeny`: which tools an agent inherits is only known once the
      # composition is booted.
      - name: Web profile acceptance
        run: pnpm run test:acceptance

      # The harness this repository pins and the `dsh` that boots the profile
      # must agree on the version and on the strict TypertCodec contract. CI has
      # no separate dsh on PATH, so this run proves the plain-clone case stays
      # green; the mismatch it reports is the one a development machine has when
      # PATH resolves to a different harness tree. `uv run` is the same venv the
      # install created.
      - name: Harness pin vs serving dsh
        run: uv run python -m refactory_dsh.harness_check

  # The Python suite (issue #272), in four parallel jobs. Every test runs on every
  # push: `--shard I/4` packs the test files by their CI durations
  # (`refactory/tests/ci_durations.json`, refreshed by `scripts/ci-durations.py` from
  # these jobs' reports), each job runs its share on four workers, and the four
  # shards together are the whole suite. A file always stays on one worker
  # (`loadscope`), so no file may take much longer than a shard's share: the
  # delivery and design-worktree tests are split by theme for that reason.
  #
  # Tests that need an external tool or a model credential are marked and skipped
  # with a reason; the toolchain summary at the end of each shard names every one
  # that did not run, so a green run states what it did not verify. The stricter
  # `--toolchain-gate` is a separate local check: this runner has no Lean, mathlib or
  # model credential. A test that hangs fails alone after `--timeout` instead of
  # holding the job to its limit, and `-rfEs` lists failures and errors at the end.
  python:
    name: Python suite (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          # `refactory/tests/test_work_complete.py` reads the commit each tracked
          # item records and asks git to resolve it. A depth-1 clone holds one
          # commit, so every recorded hash would be unresolvable and the gate would
          # fail for a reason that is about the checkout rather than the work.
          fetch-depth: 0

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: Install (fresh-checkout path)
        run: ./install.sh

      # Code nodes run in a user-namespace sandbox (`refactory_dsh.snippet`). Ubuntu
      # 24.04 restricts unprivileged user namespaces through AppArmor, which makes the
      # sandbox unavailable and its tests skip; lifting the restriction here lets the
      # suite exercise the sandbox. The probe line says whether it did.
      - name: Allow the code-node sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          fi
          uv run python -c "from refactory_dsh import snippet; print('code-node sandbox:', snippet.available())"

      # Four workers on this runner's four vCPUs. It is deliberately here and not in
      # pytest.ini, because some invocations must stay serial: --toolchain-gate reads
      # per-test reports in the controller, and the per-site base check runs one test
      # under a cap.
      - name: Python suite (shard ${{ matrix.shard }}/4)
        env:
          REFACTORY_REQUIRE_MIGRATION_TESTS: "1"
        run: >-
          uv run python -m pytest refactory/tests -q -rfEs -n 4 --timeout=900
          --shard ${{ matrix.shard }}/4 --junitxml=python-suite-shard${{ matrix.shard }}.xml

      # Each test's time, for `scripts/ci-durations.py` and to compare a test on Linux
      # with the same test on a Mac (`refactory_dsh.spawn_count`).
      - name: Keep the shard's per-test times
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-suite-times-shard${{ matrix.shard }}
          path: python-suite-shard${{ matrix.shard }}.xml
          if-no-files-found: ignore

  # macOS is a first-class platform, and the one where a process launch costs most: an
  # endpoint-security agent can make each one 30 ms or more. This job runs the TypeScript
  # suite and the Python tests that hold refactory's launch counts down
  # (`test_launch_budget.py`, the target guard's) plus a whole design run, so a change that
  # breaks the Mac or adds launches to the agent-step path fails here. The full Python
  # suite stays on Linux.
  macos:
    name: macOS (TypeScript suite + Python launch budget)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: Install (fresh-checkout path)
        run: ./install.sh

      - name: TypeScript suite
        run: pnpm test

      - name: Python launch budget and target guard
        run: >-
          uv run python -m pytest -q -rs -n 3
          refactory/tests/test_launch_budget.py
          refactory/tests/test_target_guard_launches.py
          refactory/tests/test_git_exe.py
          refactory/tests/test_spawn_count.py
          refactory/tests/test_target_guard.py
          refactory/tests/test_qa_judge.py
