# The gate this repository was missing. Issue #270 exists because nothing ever
# ran the fresh-checkout sequence: `install.sh` built before it created `.venv`
# (invisible on every machine that already had one), and 32 stale tests could sit
# red on `main` because no job observed them.
#
# This job runs `install.sh` itself rather than restating its steps, so the
# ordering bug that motivated it cannot come back unnoticed. A runner is exactly
# the fresh machine the installer claims to support: no `.venv`, no
# `node_modules`, no DSH profile.
#
# Scope: the TypeScript suite (`pnpm test`) is the suite #270 measured and fixed.
# The Python suite under `refactory/tests/` is red for unrelated, pre-existing
# reasons (40 failures) and is not gated here yet; running `install.sh` still
# exercises the Python install, because `pnpm run build` begins with `docs:check`
# against `.venv/bin/python`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref: a newer push cancels an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install-and-test:
    name: install.sh + TypeScript suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # `pnpm/setup` is the action for pnpm 11+ (this repo pins pnpm@11.7.0). It
      # installs the pinned pnpm — read from package.json's `packageManager`, so it
      # cannot drift — and the Node runtime in one step, replacing setup-node.
      # `install: false` leaves the dependency install to `install.sh`, the path
      # under test.
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false

      # uv owns `.venv` and reads `uv.lock`; the ordering fix depends on it
      # existing before the Node build runs `docs:check`. Pinned by commit: this
      # action publishes version tags, not a moving major one.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # The path a new checkout takes. On a fresh runner this is the real test of
      # the ordering, and it also creates the DSH profile the bundle needs.
      - name: Install (fresh-checkout path)
        run: ./install.sh

      # The TypeScript suite (`pnpm test`). Its 32 stale expectations are why
      # this job exists; a red suite here is the gate working.
      - name: TypeScript suite
        run: pnpm test

      # The whole-profile acceptance run: it runs `dsh_profile`'s provisioning
      # plan into a throwaway DSH_HOME, composes the owned `refactory-web` profile
      # from the harness's own `web` template, checks that template is left exactly
      # as it was, boots `refactory-web` and asks its live services. It belongs in
      # CI because it is the only thing that proves the `ceo` preset reaches the
      # roster through configured roots instead of a patched agent-presets tree,
      # and that the refactory-web layer mounts the console and picker with a
      # checkout-resolved `repoRoot` — a unit test cannot see the layer order that
      # decides whether a patch finds its row at all.
      - name: Web profile acceptance
        run: pnpm run test:acceptance

      # The harness this repository pins and the `dsh` that boots the profile
      # must agree on the version and on the strict TypertCodec contract. CI has
      # no separate dsh on PATH, so this run proves the plain-clone case stays
      # green; the mismatch it reports is the one a development machine has when
      # PATH resolves to a different harness tree. `uv run` is the same venv the
      # install created.
      - name: Harness pin vs serving dsh
        run: uv run python -m refactory_dsh.harness_check
