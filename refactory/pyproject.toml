[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refactory-dsh"
version = "0.1.0"
description = "refactory's graph semantics -> graph.json -> DSH executes (create / optimize / design meta-modes)."
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "PyYAML>=6", "structlog>=24"]

[project.scripts]
refactory = "refactory_dsh.cli:main"

# The same default test dependencies the root project declares, so `uv run python
# -m pytest tests -q` also works from inside this directory: `uv run` uses the
# nearest pyproject.toml, and without this a reader who `cd refactory` gets a second
# environment with no pytest in it. Every *documented* command runs from the
# repository root, where the one project lives and where `uv sync --group
# reference` adds the tests' reference oracle.
[dependency-groups]
dev = ["pytest>=8", "sympy>=1.12"]

[tool.setuptools.packages.find]
include = ["refactory_dsh*", "refactory_packages*"]

[tool.setuptools]
py-modules = []

[project.entry-points.'refactory.environment_overlay']
worktree = "refactory_dsh.worktree:_worktree_environment_overlay"

[project.entry-points.'refactory.feedback_refill']
default = "refactory_dsh.feedback_refill:refill"

[project.entry-points.'refactory.skip_receipt']
skip_receipt = "refactory_dsh.authoring_evidence:record_skip"

[project.entry-points.'refactory.worktree_state']
worktree = "refactory_dsh.worktree:_worktree_state_bridge"

[project.entry-points.'refactory.delivery_identity']
authoring = "refactory_dsh.authoring_evidence:delivery_identity"

[project.entry-points.'refactory.steer']
steer = "refactory_dsh.console"

[project.entry-points.'refactory.owner_module']
interactive = "refactory_dsh.interactive"

[project.entry-points.'refactory.run_end']
warm_clones = "refactory_dsh.builder_probe:sweep_warm_clones"
workspaces = "refactory_dsh.workspace:sweep"

[project.entry-points.'refactory.workspace_clone']
clones = "refactory_dsh.clones:prepare"

[tool.setuptools.package-data]
refactory_dsh = ["*.mjs", "patches/*.yml", "data/*.json"]
